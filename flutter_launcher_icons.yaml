# Regenerate: dart run flutter_launcher_icons
# Sources in assets/branding (not app assets).
flutter_launcher_icons:
  android: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  # The foreground PNGs are already drawn for the 108dp canvas.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: true
  image_path_ios: assets/branding/icon.png
  remove_alpha_ios: true
